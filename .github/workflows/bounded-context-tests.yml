---
name: Combined Tests
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
env:
  BOOST_VERSION: 1.87.0
  BOOST_ROOT: C:\Dev_Env\boost\boost
  OPENCV_DIR: C:\tools\opencv
jobs:
  combined-tests:
    name: Camera and Image Analysis Tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OpenCV
        uses: actions/cache@v3
        with:
          path: ${{ env.OPENCV_DIR }}
          key: ${{ runner.os }}-opencv-4.10.0-binaries
          restore-keys: |
            ${{ runner.os }}-opencv-4.10.0-

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.0.3"

      - name: Install OpenCV
        run: |
          if (-not (Test-Path "$env:OPENCV_DIR")) {
            Write-Host "Installing OpenCV 4.10.0..."
            New-Item -ItemType Directory -Path C:\tools -Force
            pushd C:\tools
            $url = "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe"
            Invoke-WebRequest -Uri $url -OutFile "opencv.exe"
            Start-Process -FilePath "opencv.exe" -ArgumentList "-o", "$env:OPENCV_DIR", "-y" -Wait
            Remove-Item "opencv.exe"
            Write-Host "✓ OpenCV installed at $env:OPENCV_DIR"
            popd
          } else {
            Write-Host "✓ OpenCV found in cache"
          }
        shell: pwsh      
        
      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: ${{ env.BOOST_VERSION }}
          boost_install_dir: C:\Dev_Env\
          platform_version: 2022
          toolset: msvc

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64      

      # Camera Bounded Context Tests
      - name: Configure Camera Tests
        working-directory: Software/LMSourceCode/ImageProcessing/Camera
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          mkdir build
          cmake . -DCMAKE_BUILD_TYPE=Debug -B build -DBoost_INCLUDE_DIR=${{steps.install-boost.outputs.BOOST_ROOT}}/include -DBoost_LIBRARY_DIRS=${{steps.install-boost.outputs.BOOST_ROOT}}/lib
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        shell: pwsh

      - name: Build Camera Tests
        working-directory: Software/LMSourceCode/ImageProcessing/Camera
        run: |
          cd build
          cmake --build . --config Debug
        shell: pwsh

      - name: Run Camera Tests
        working-directory: Software/LMSourceCode/ImageProcessing/Camera
        run: |
          Write-Host "=== Running Camera Bounded Context Tests ==="
          ./build/tests/Debug/camera_tests.exe
          
          Write-Host "=== Running Camera CTest ==="
          cd build/tests/Debug
          ctest -C Debug --verbose --output-on-failure
        shell: pwsh

      # Image Analysis Tests
      - name: Configure Image Analysis Tests
        working-directory: Software/LMSourceCode/ImageProcessing/ImageAnalysis
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          mkdir build
          $OpenCVConfigPath = "$env:OPENCV_DIR\build"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENCV_DIR="$OpenCVConfigPath"
        shell: pwsh      
        
      - name: Build and Run Image Analysis Tests
        working-directory: Software/LMSourceCode/ImageProcessing/ImageAnalysis
        run: |
          pushd build
          cmake --build . --config Release
          
          # Add OpenCV DLLs to PATH for test execution
          $opencvBinPath = "$env:OPENCV_DIR\build\x64\vc16\bin"
          if (Test-Path $opencvBinPath) {
            $env:PATH = "$opencvBinPath;$env:PATH"
          }
          
          Write-Host "=== Running Image Analysis Tests ==="
          ctest -C Release --output-on-failure
          popd
        shell: pwsh
